[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "relpath-bench"
version = "0.1.0"
description = "Benchmark comparing knowledge-graph relational path retrieval algorithms"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
dependencies = ["numpy", "scipy", "pyarrow", "huggingface_hub"]

[project.optional-dependencies]
embed = ["sentence-transformers", "pcst_fast"]
metaqa = ["gdown"]
dev = ["pytest", "pytest-cov", "pcst_fast"]

[project.scripts]
relpath-bench = "relpath_bench.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/relpath_bench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
