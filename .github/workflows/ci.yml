name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # the prebuilt manylinux pcst_fast wheel returns wrong results under numpy 2;
      # build it from source first so the editable install keeps it
      - run: pip install --no-binary pcst_fast pcst_fast
      - run: pip install -e '.[dev]'
      - run: pytest --cov=relpath_bench --cov-fail-under=80
